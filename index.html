<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0b'/><rect x='20' y='44' width='60' height='12' rx='3' fill='%23d4ff3d'/><rect x='12' y='34' width='12' height='32' rx='3' fill='%23d4ff3d'/><rect x='76' y='34' width='12' height='32' rx='3' fill='%23d4ff3d'/></svg>">
<style>
:root{
  --bg:#0a0a0b; --surface-top:#141416; --surface-bot:#101012; --surface-2:#17171a;
  --input-bg:#0d0d0f; --border:#26262a; --border-soft:#1e1e22; --border-dash:#2a2a2e;
  --text:#f2f2ec; --text-2:#e4e4de; --text-dim:#a6a6a0; --text-muted:#6a6a66;
  --text-faint:#5c5c58; --text-ghost:#3d3d41; --text-ghost-2:#33333a;
  --accent:#d4ff3d; --accent-hover:#e2ff70; --on-accent:#0a0a0b; --danger:#ff6b5c;
  --glow:rgba(212,255,61,0.12);
}
body.theme-cream{
  --bg:#f6f0e6; --surface-top:#fffdf9; --surface-bot:#f7f1e6; --surface-2:#f0e8da;
  --input-bg:#fffdfa; --border:#e2d8c6; --border-soft:#ece3d4; --border-dash:#dccfba;
  --text:#3f362c; --text-2:#4d4338; --text-dim:#6b6055; --text-muted:#8a7c6b;
  --text-faint:#a1937f; --text-ghost:#bcae99; --text-ghost-2:#cfc3af;
  --accent:#a94f6d; --accent-hover:#95405d; --on-accent:#fffdf9; --danger:#c65a4e;
  --glow:rgba(169,79,109,0.20);
}
/* Medianoche: azul noche profundo + ámbar cálido */
body.theme-midnight{
  --bg:#0b1020; --surface-top:#161d33; --surface-bot:#111728; --surface-2:#1b2340;
  --input-bg:#0a0f1c; --border:#293356; --border-soft:#1e2745; --border-dash:#313d63;
  --text:#eef2ff; --text-2:#dbe2f5; --text-dim:#9aa6cc; --text-muted:#6e7aa3;
  --text-faint:#5a6690; --text-ghost:#3c4670; --text-ghost-2:#2e3760;
  --accent:#ffb340; --accent-hover:#ffc668; --on-accent:#0b1020; --danger:#ff6b6b;
  --glow:rgba(255,179,64,0.15);
}
/* Nieve: gris muy claro y frío + índigo */
body.theme-snow{
  --bg:#eef1f6; --surface-top:#ffffff; --surface-bot:#f4f6fa; --surface-2:#e6eaf2;
  --input-bg:#ffffff; --border:#d3d9e6; --border-soft:#e2e7f0; --border-dash:#c6cede;
  --text:#1d2433; --text-2:#2b3444; --text-dim:#525c70; --text-muted:#6f7a91;
  --text-faint:#8a93a6; --text-ghost:#aab2c2; --text-ghost-2:#c2c9d6;
  --accent:#5257d8; --accent-hover:#4247c4; --on-accent:#ffffff; --danger:#d64545;
  --glow:rgba(82,87,216,0.18);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 62%);
  background-attachment:fixed;
  color:var(--text-2); min-height:100vh;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  transition:background-color .2s,color .2s;
}
.wrap{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);opacity:.6;cursor:pointer}
body.light input[type=date]::-webkit-calendar-picker-indicator{filter:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Header */
header{margin-bottom:22px}
.title-row{display:flex;align-items:baseline;gap:12px}
h1{font-size:24px;line-height:1;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text);margin:0}
.dot{height:7px;width:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.version{margin-left:auto;background:none;border:1px solid var(--border);color:var(--text-faint);
  font-size:11px;padding:3px 8px;border-radius:20px;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  transition:.15s;align-self:center;flex-shrink:0}
.version:hover{color:var(--accent);border-color:var(--accent)}
.datapanel{margin-top:14px}
.data-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.warn{font-size:11px;color:var(--text-faint);line-height:1.6;margin:10px 0 0}
.subtitle{font-size:13px;color:var(--text-muted);margin:10px 0 0}
.profiles{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--input-bg);border:1px solid var(--border-soft);border-radius:4px}
.seg button{padding:7px 12px;font-size:13px;border-radius:2px;border:none;background:none;color:var(--text-faint);transition:.15s}
.seg button.on{background:var(--border-soft);color:var(--accent);font-weight:600}
body.light .seg{background:var(--surface-2)}
body.light .seg button.on{background:var(--surface-top)}

.skins{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:8px}
.skin{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:4px;
  border:1px solid var(--border);background:var(--input-bg);color:var(--text-muted);font-size:12px;transition:.15s}
.skin:hover{color:var(--text-2);border-color:var(--text-ghost)}
.skin.on{border-color:var(--accent);color:var(--text);font-weight:600}
.skin-dots{display:inline-flex;gap:2px}
.skin-dots span{width:11px;height:11px;border-radius:50%;border:1px solid rgba(128,128,128,.35);display:block}

/* Nav */
nav{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--border-soft);overflow-x:auto}
nav button{display:flex;align-items:center;gap:7px;padding:12px 13px;font-size:13px;font-weight:500;
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-faint);
  white-space:nowrap;transition:.15s}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
nav svg{width:15px;height:15px}

/* Surfaces */
.card{background:linear-gradient(180deg,var(--surface-top),var(--surface-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);border-radius:4px}
body.light .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(90,80,60,.07)}
.pad{padding:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:16px}.g25{gap:10px}.g1{gap:4px}.g2{gap:8px}
.wraprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* Inputs */
.inp{background:var(--input-bg);border:1px solid var(--border);border-radius:3px;padding:8px 10px;
  font-size:14px;color:var(--text-2);transition:.15s;max-width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--glow)}
.inp::placeholder{color:var(--text-ghost)}
.full{width:100%}
select.inp{-webkit-appearance:none;appearance:none}
select.inp option{background:var(--surface-2);color:var(--text)}

/* Buttons */
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:3px;padding:10px 18px;
  font-size:13px;font-weight:600;transition:.15s;box-shadow:0 0 18px var(--glow)}
.btn:hover{background:var(--accent-hover)}
.btn-sm{background:var(--accent);color:var(--on-accent);border:none;border-radius:3px;padding:7px 12px;font-size:12px;font-weight:600}
.ghost{background:none;border:none;color:var(--text-muted);font-size:13px;padding:8px 10px}
.ghost:hover{color:var(--text)}
.link{background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:500;padding:0;
  display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--accent)}
.link-accent{color:var(--accent)}
.dashed{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--border-dash);
  border-radius:4px;background:none;padding:13px;font-size:14px;font-weight:500;color:var(--text-muted);width:100%}
.dashed:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn{background:none;border:none;padding:5px;color:var(--text-ghost);display:flex;align-items:center;border-radius:2px}
.iconbtn:hover{color:var(--text)}
.iconbtn.dg:hover{color:var(--danger)}
.txt-danger{background:none;border:none;padding:0;color:var(--danger);font-size:12px;font-weight:600}
.txt-muted{background:none;border:none;padding:0;color:var(--text-muted);font-size:12px}
.txt-danger:hover,.txt-muted:hover{text-decoration:underline}
button:disabled{opacity:.5;cursor:default}

/* Stats */
.stat-num{font-size:19px;font-weight:600;line-height:1;color:var(--text);margin:0;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin:6px 0 0}
.divider{width:1px;height:36px;background:var(--border)}
.summary{display:flex;align-items:center;gap:22px;padding:14px 16px;flex-wrap:wrap}

/* Exercise block */
.exercise{overflow:hidden;border-left:3px solid var(--border)}
.ex-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.ex-toggle{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:none;border:none;
  text-align:left;color:inherit;padding:0}
.ex-name{color:var(--text);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:2px;flex-shrink:0;white-space:nowrap}
.ex-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}
.count{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.progress{height:2px;background:var(--border-soft)}
.progress > div{height:100%;transition:width .3s;background:var(--accent)}
.ex-body{padding:10px 12px 12px}

/* Sets */
.set{display:flex;align-items:center;gap:9px;padding:6px 6px 6px 10px;border-radius:3px;
  border-left:2px solid var(--border);transition:.15s}
.set.ghost{border-left-color:var(--text-ghost);border-left-style:dashed}
.set.ghost .num::placeholder{color:var(--text-ghost);font-weight:600;opacity:.85}
.set.done{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.set-idx{display:flex;align-items:center;justify-content:center;width:20px;height:20px;font-size:11px;
  font-weight:600;flex-shrink:0;border-radius:2px;border:1px solid var(--border);color:var(--text-ghost);
  font-variant-numeric:tabular-nums}
.set.done .set-idx{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.num{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:3px;padding:9px 10px;
  font-size:16px;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums;transition:.15s}
.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--glow)}
.num::placeholder{color:var(--text-ghost-2);font-weight:500}
.unit{font-size:10px;color:var(--text-faint);flex-shrink:0}
.times{color:var(--text-ghost-2);font-size:12px}

/* Picker */
.picker{border:1px dashed var(--border-dash);border-radius:4px;padding:12px}
.copy-item{width:100%;border:none;background:none;text-align:left;padding:9px 10px;
  border-radius:3px;display:block}
.copy-item:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.copy-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.copy-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.copy-meta{font-size:11px;color:var(--text-faint);flex-shrink:0}
.copy-tags{display:flex;flex-wrap:wrap;gap:4px}
.picker-list{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ex-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:3px}
.ex-row:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.ex-pick{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:none;
  text-align:left;color:inherit;padding:0}
.ex-pick-name{font-size:14px;color:var(--text-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;padding-left:8px}
.edit-box{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface-2);
  border-radius:3px;border-left:2px solid var(--accent)}
.confirm-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;
  background:var(--surface-2);border-radius:3px;border-left:2px solid var(--danger)}

/* Chips / pills */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:7px 12px;font-size:13px;border-radius:3px;border:1px solid var(--border);
  background:none;color:var(--text-muted);transition:.15s}
.pill.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:500}
.daychip{padding:7px 12px;font-size:13px;border-radius:3px;border:1px solid var(--border);color:var(--text-muted)}
.daychip.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:600}

/* Cards / titles */
.card-title{font-size:11px;color:var(--text-faint);margin:0 0 14px;letter-spacing:.08em;text-transform:uppercase}

/* History */
.year-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
  background:none;border:none;color:inherit;text-align:left}
.year-label{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.year-count{font-size:12px;color:var(--text-faint)}
.month-list{border-top:1px solid var(--border-soft);padding:4px 0}
.month-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 8px 18px;
  background:none;border:none;color:inherit;text-align:left}
.month-head:hover:not(:disabled){background:color-mix(in srgb,var(--text) 3%,transparent)}
.month-head:disabled{opacity:.32}
.month-label{font-size:13px;font-weight:500;color:var(--text-2)}
.month-count{font-size:11px;font-weight:600;color:var(--accent);border-radius:10px;padding:1px 7px;
  background:color-mix(in srgb,var(--accent) 14%,transparent);font-variant-numeric:tabular-nums}
.session-list{display:flex;flex-direction:column;gap:6px;padding:6px 12px 12px 22px}
.session-list .card{background:var(--input-bg);border:1px solid var(--border-soft);box-shadow:none}
.hist-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
  background:none;border:none;color:inherit;text-align:left;gap:8px}
.hist-num{font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;flex-shrink:0}
.hist-day{font-size:14px;font-weight:500;color:var(--text)}
.hist-date{font-size:12px;color:var(--text-faint)}
.hist-body{padding:10px 12px 12px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.hist-ex{font-size:14px}
.hist-ex-name{color:var(--text-2);font-weight:500}
.hist-sets{color:var(--text-muted);font-variant-numeric:tabular-nums}

/* Steps */
.steps-big{font-size:30px;font-weight:700;line-height:1;color:var(--text);margin:0;font-variant-numeric:tabular-nums}
.steps-goal{font-size:15px;font-weight:400;color:var(--text-faint);margin-left:8px}
.steps-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.heat-labels span{height:12px;font-size:9px;line-height:12px;color:var(--text-ghost);width:10px;text-align:right}

/* Tooltip de gráficas */
.chart-tip{position:absolute;z-index:20;pointer-events:none;background:var(--surface-2);
  border:1px solid var(--border);border-radius:4px;padding:9px 11px;font-size:12px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:120px;max-width:210px;line-height:1.5}
body.light .chart-tip{box-shadow:0 8px 24px rgba(90,80,60,.22)}
.chart-tip .tip-date{font-weight:600;margin-bottom:5px;font-size:11px;color:var(--text-dim)}
.chart-tip .tip-row{display:flex;justify-content:space-between;gap:12px}
.chart-tip .tip-val{font-variant-numeric:tabular-nums;font-weight:600}

/* Aviso de copia de seguridad */
.notice{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:12px 14px;
  border-radius:4px;background:color-mix(in srgb,var(--accent) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.notice-ico{color:var(--accent);display:flex;flex-shrink:0;margin-top:1px}
.notice-txt{font-size:12px;color:var(--text-2);line-height:1.55;flex:1;min-width:0}
.notice-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* Temporizador de descanso */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:60;min-width:270px;max-width:calc(100vw - 32px);
  background:linear-gradient(180deg,var(--surface-top),var(--surface-bot));
  border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;
  box-shadow:0 14px 44px rgba(0,0,0,.55);overflow:hidden}
body.light .rest{box-shadow:0 14px 44px rgba(90,80,60,.28)}
.rest.done{border-left-color:var(--accent);animation:restpulse .5s ease 2}
@keyframes restpulse{0%,100%{background:linear-gradient(180deg,var(--surface-top),var(--surface-bot))}
  50%{background:color-mix(in srgb,var(--accent) 18%,var(--surface-top))}}
.rest-bar{height:3px;background:var(--border-soft)}
.rest-bar>div{height:100%;background:var(--accent);transition:width .25s linear}
.rest-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.rest .rest-main{font-size:21px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
  letter-spacing:.02em}
.rest.done{display:flex;align-items:center;gap:12px;padding:13px 14px}
.rest.done .rest-main{font-size:15px;color:var(--accent)}
.rest-lbl{font-size:12px;color:var(--text-muted);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rest-add{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:3px;
  padding:5px 9px;font-size:11px;font-weight:600;flex-shrink:0}
.rest-add:hover{color:var(--accent);border-color:var(--accent)}
.rest-x{background:none;border:none;color:var(--text-ghost);padding:4px;display:flex;flex-shrink:0}
.rest-x:hover{color:var(--text)}

/* Empty / misc */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;
  border:1px dashed var(--border);border-radius:4px}
.empty h3{color:var(--text-2);font-weight:500;margin:14px 0 6px;font-size:15px}
.empty p{font-size:13px;color:var(--text-faint);max-width:320px;line-height:1.6;margin:0}
.savestate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-faint);min-height:18px}
.savedot{width:6px;height:6px;border-radius:50%;background:var(--text-ghost)}
.savedot.on{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--border-soft)}
.footer-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;

/* ============================ Utilidades ============================ */

const pad = n => String(n).padStart(2,"0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = iso => new Date(iso + "T00:00:00");

function cutoffFor(months){ if(months==null) return null; const d=new Date(); d.setMonth(d.getMonth()-months); return toISO(d); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return toISO(d); }
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ====================== Almacenamiento (localStorage) ======================
   Síncrono a propósito: no hay temporizadores ni escrituras en vuelo, así que
   cambiar de perfil no puede perder datos. Prefijo propio para no chocar con
   nada más que haya en el mismo origen.                                      */
const K = "gymtracker:";
const store = {
  get(key, fallback){
    try{ const raw = localStorage.getItem(K+key); return raw===null ? fallback : JSON.parse(raw); }
    catch{ return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem(K+key, JSON.stringify(value)); return true; }
    catch(e){ console.error("No se pudo guardar", key, e); toast("No se pudo guardar (almacenamiento lleno)"); return false; }
  },
  del(key){ try{ localStorage.removeItem(K+key); }catch{} },
  keys(prefix){
    const out=[];
    try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(K+prefix)) out.push(k.slice(K.length)); } }catch{}
    return out;
  }
};

/* Sesiones agrupadas por mes: sessions:<perfil>:<AAAA-MM> */
function loadSessions(pid){
  const out=[];
  store.keys(`sessions:${pid}:`).forEach(k=>{
    const arr = store.get(k, []);
    if(Array.isArray(arr)) arr.forEach(s=>{ if(s && s.id && s.date) out.push(s); });
  });
  out.sort((a,b)=> a.date<b.date ? 1 : -1);
  return out;
}
function saveSessionMonth(pid, month, allSessions){
  const bucket = allSessions.filter(s=>monthOf(s.date)===month && s.entries.length>0);
  if(bucket.length===0) store.del(`sessions:${pid}:${month}`);
  else store.set(`sessions:${pid}:${month}`, bucket);
}
function saveAllSessions(pid, allSessions){
  const months = new Set(allSessions.map(s=>monthOf(s.date)));
  store.keys(`sessions:${pid}:`).forEach(k=>months.add(k.split(":")[2]));
  months.forEach(m=>saveSessionMonth(pid,m,allSessions));
}
function deleteAllSessions(pid){ store.keys(`sessions:${pid}:`).forEach(k=>store.del(k)); }

/* Pasos: steps:<perfil>:<AAAA-MM> -> { fecha: nº } */
function loadSteps(pid){
  const out={};
  store.keys(`steps:${pid}:`).forEach(k=>{ const o=store.get(k,{}); if(o&&typeof o==="object") Object.assign(out,o); });
  return out;
}
function saveStepsMonth(pid, month, allSteps){
  const bucket={};
  Object.entries(allSteps).forEach(([d,v])=>{ if(monthOf(d)===month && v>0) bucket[d]=v; });
  if(Object.keys(bucket).length===0) store.del(`steps:${pid}:${month}`);
  else store.set(`steps:${pid}:${month}`, bucket);
}

function loadProfiles(){
  let p = store.get("profiles", null);
  if(!Array.isArray(p) || p.length===0){ store.set("profiles", DEFAULT_PROFILES); return DEFAULT_PROFILES.map(x=>({...x})); }
  let changed=false;
  p = p.map((prof,i)=>{
    const fb = DEFAULT_PROFILES[i] || DEFAULT_PROFILES[0];
    const name = LEGACY_NAMES[prof.name] ?? prof.name;
    const theme = prof.theme ?? fb.theme;
    const steps = prof.steps ?? fb.steps;
    if(name!==prof.name||theme!==prof.theme||steps!==prof.steps) changed=true;
    return {...prof, name, theme, steps};
  });
  if(changed) store.set("profiles", p);
  return p;
}

/* ==================== Cálculo de calorías ====================
   Método:
   - Metabolismo basal (BMR) con Mifflin-St Jeor.
   - Pasos: longitud de zancada ≈ altura × 0,415 → distancia → tiempo a ~4,5 km/h.
     Caminar a ese ritmo son ~3,5 MET.
   - Entrenamiento: 3,5 MET no; el entrenamiento de fuerza intenso (RIR 1-2) son
     ~6 MET según el compendio de actividades físicas de Ainsworth.
   - Fórmula ACSM: kcal/min = MET × 3,5 × peso(kg) / 200.
   - Para no contar dos veces el metabolismo basal, del gasto de la actividad se
     descuenta 1 MET (lo que ya estarías gastando en reposo ese rato).
   Es una ESTIMACIÓN: el error típico de estos métodos ronda el 10-20%.        */
const MET_WALK = 3.5, WALK_KMH = 4.5, STRIDE_FACTOR = 0.415;
// El entrenamiento no es esfuerzo continuo: la serie en sí es intensa (~6 MET)
// pero el descanso entre series es actividad ligera de pie (~1,5 MET). Aplicar
// 6 MET a la sesión entera sobrestimaba mucho el gasto.
const MET_LIFT_WORK = 6.0, MET_LIFT_REST = 1.5;
// 3,33 min/serie sale de la sesión típica de Iván: 7-8 ejercicios x 3 series
// (~22,5 series) con 2 min de descanso = 1 h 15 min. Así la duración se estima
// sola y escala si un día haces más o menos volumen del habitual.
// Sesión típica de Iván: serie de ~1 min + 2 min de descanso = 3 min por serie.
// 7-8 ejercicios x 3 series (~24 series) x 3 min = ~72 min, sus 1 h 15.
const DEFAULT_BODY = {weight:null, height:null, age:null, sex:"m", setSec:60, restMin:2};

function bodyOf(pid){ return {...DEFAULT_BODY, ...store.get(`body:${pid}`,{})}; }
function bodyComplete(b){ return b.weight>0 && b.height>0 && b.age>0; }

function bmr(b){
  if(!bodyComplete(b)) return null;
  const base = 10*b.weight + 6.25*b.height - 5*b.age;
  return Math.round(b.sex==="f" ? base-161 : base+5);
}
// kcal netas de una actividad (ya descontado el reposo equivalente)
function netKcal(met, weightKg, minutes){
  if(!weightKg||!minutes) return 0;
  return Math.max(0, (met-1) * 3.5 * weightKg / 200 * minutes);
}
function stepsMinutes(steps, heightCm){
  if(!steps||!heightCm) return 0;
  const km = steps * (heightCm*STRIDE_FACTOR/100) / 1000;
  return km / WALK_KMH * 60;
}
function stepsKcal(steps, b){
  if(!bodyComplete(b)||!steps) return 0;
  return Math.round(netKcal(MET_WALK, b.weight, stepsMinutes(steps, b.height)));
}
// Duración de la sesión: la anotada a mano, o estimada por nº de series
function sessionSets(sess){
  if(!sess) return 0;
  return sess.entries.reduce((a,e)=>a+e.sets.filter(x=>x.weight!==""&&x.reps!=="").length,0);
}
function sessionSplit(sess, b){
  const sets = sessionSets(sess);
  const work = sets * (b.setSec||DEFAULT_BODY.setSec)/60;
  const rest = sets * (b.restMin??DEFAULT_BODY.restMin);
  return {sets, work, rest, total: work+rest};
}
function sessionMinutes(sess, b){
  if(!sess) return 0;
  return sessionSplit(sess,b).total;
}
// El gasto se calcula por separado: series a 6 MET, descansos a 1,5 MET
function trainingKcal(sess, b){
  if(!bodyComplete(b)||!sess) return 0;
  const sp = sessionSplit(sess,b);
  return Math.round(
    netKcal(MET_LIFT_WORK, b.weight, sp.work) +
    netKcal(MET_LIFT_REST, b.weight, sp.rest)
  );
}

/* ==================== Copia de seguridad ====================
   Exporta TODO el almacenamiento de la app (los dos perfiles, ejercicios,
   sesiones, pasos, objetivos y datos corporales) a un único archivo JSON.
   Es el plan de migración: sirve para cambiar de móvil, para no perderlo si
   se borran los datos de Chrome y para archivar el histórico.               */
function exportData(){
  const data={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith(K)) data[k.slice(K.length)]=localStorage.getItem(k);
    }
  }catch(e){ return null; }
  return {
    app:"gym-tracker",
    version:APP_VERSION,
    exportedAt:new Date().toISOString(),
    profiles:(store.get("profiles",[])||[]).map(p=>p.name),
    keys:Object.keys(data).length,
    data
  };
}

const BACKUP_DAYS = 15;

// Días desde la última copia. null = nunca se ha hecho ninguna.
function daysSinceBackup(){
  const t=store.get("lastBackup",null);
  if(!t) return null;
  return Math.floor((Date.now()-t)/86400000);
}

function backupDue(){
  // No molestar si todavía no hay nada que perder
  const st=backupStats();
  if(st.sesiones===0 && st.dias===0) return false;
  const d=daysSinceBackup();
  return d===null || d>=BACKUP_DAYS;
}

function backupStats(){
  const profs=store.get("profiles",[])||[];
  let sesiones=0, dias=0;
  profs.forEach(p=>{
    loadSessions(p.id).forEach(()=>sesiones++);
    dias+=Object.keys(loadSteps(p.id)).length;
  });
  return {sesiones, dias, perfiles:profs.length};
}

function backupFilename(){ return `gym-tracker-copia-${todayISO()}.json`; }

function markBackupDone(){
  store.set("lastBackup", Date.now());
  S.backupDismissed=true;
  renderBackupNotice();
  renderDataPanel();
}

function buildBackupBlob(){
  const payload=exportData();
  if(!payload) return null;
  return new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
}

// Descarga al almacenamiento del teléfono
function downloadBackup(){
  const blob=buildBackupBlob();
  if(!blob){ toast("No se pudo leer el almacenamiento"); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=backupFilename();
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
  markBackupDone();
  toast("Copia descargada");
}

/* Enviar por correo.
   Una app sin servidor no puede enviar correos por su cuenta, y `mailto:` no
   admite adjuntos. Lo que sí funciona en Android es la API Web Share: abre el
   menú del sistema con el archivo YA adjunto, se elige Gmail y se envía.
   Sin conexión (o si el navegador no lo admite) se descarga, como pediste.  */
/* Chrome limita qué tipos de archivo se pueden compartir: application/json NO
   está en su lista permitida, así que canShare() lo rechazaba y el envío caía
   en la descarga sin avisar. Se prueban varios formatos de mayor a menor
   preferencia; text/plain sí está permitido y Gmail lo adjunta igual.      */
const SHARE_TYPES = [
  {mime:"application/json", ext:"json"},
  {mime:"text/plain",       ext:"json"},
  {mime:"text/plain",       ext:"txt"}
];

function shareSupport(){
  if(!navigator.share) return {ok:false, reason:"no-share"};
  if(!navigator.canShare) return {ok:false, reason:"no-canshare"};
  for(const t of SHARE_TYPES){
    try{
      const probe=new File(["{}"], "prueba."+t.ext, {type:t.mime});
      if(navigator.canShare({files:[probe]})) return {ok:true, type:t};
    }catch{}
  }
  return {ok:false, reason:"tipo-no-permitido"};
}

async function sendBackup(){
  const payload=exportData();
  if(!payload){ toast("No se pudo leer el almacenamiento"); return; }
  const texto=JSON.stringify(payload,null,2);

  if(navigator.onLine===false){
    downloadBackup();
    toast("Sin conexión: copia descargada");
    return;
  }

  const sup=shareSupport();
  if(!sup.ok){
    downloadBackup();
    toast(sup.reason==="no-share"
      ? "Este navegador no puede compartir: copia descargada"
      : "No se pudo compartir: copia descargada");
    return;
  }

  const dest=store.get("backupEmail","") || "";
  const nombre=`gym-tracker-copia-${todayISO()}.${sup.type.ext}`;
  const file=new File([texto], nombre, {type:sup.type.mime});
  const st=backupStats();
  try{
    await navigator.share({
      files:[file],
      title:`Copia Gym Tracker · ${fmtDate(todayISO())}`,
      text:`Copia de seguridad de Gym Tracker (${st.sesiones} sesiones, ${st.dias} días de pasos).`
           + (dest?`\n\nEnviar a: ${dest}`:"")
    });
    markBackupDone();
    toast("Copia enviada");
  }catch(err){
    if(err && err.name==="AbortError") return;   // el usuario canceló: normal
    downloadBackup();
    toast("El envío falló: copia descargada");
  }
}


// Sustituye TODO el contenido actual por el de la copia
function restoreBackup(payload){
  if(!payload || payload.app!=="gym-tracker" || !payload.data || typeof payload.data!=="object")
    return {ok:false, error:"El archivo no es una copia válida de Gym Tracker."};
  const entries=Object.entries(payload.data);
  if(entries.length===0) return {ok:false, error:"La copia está vacía."};
  try{
    // Limpia solo las claves de esta app, nunca el resto del almacenamiento
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k && k.startsWith(K)) localStorage.removeItem(k);
    }
    entries.forEach(([k,v])=>localStorage.setItem(K+k,v));
    return {ok:true, count:entries.length};
  }catch(e){ return {ok:false, error:"No se pudo escribir en el almacenamiento."}; }
}

/* ==================== Récords y 1RM ====================
   1RM estimado con la fórmula de Epley: peso × (1 + reps/30). Permite comparar
   series de rangos distintos (un 8x80 frente a un 12x65) en una sola cifra.
   Pierde fiabilidad por encima de ~12 reps, así que ahí se descarta.        */
function e1RM(weight, reps){
  const w=parseFloat(weight)||0, r=parseFloat(reps)||0;
  if(w<=0 || r<=0 || r>12) return 0;
  return w * (1 + r/30);
}

// Mejor marca histórica de un ejercicio, opcionalmente ignorando una fecha
function bestFor(exerciseId, excludeDate){
  let best={e1rm:0, weight:0, reps:0, date:null, wBest:0, wReps:0, wDate:null};
  S.sessions.forEach(sess=>{
    if(excludeDate && sess.date===excludeDate) return;
    sess.entries.forEach(e=>{
      if(e.exerciseId!==exerciseId) return;
      e.sets.forEach(st=>{
        const w=parseFloat(st.weight)||0, r=parseFloat(st.reps)||0;
        if(w<=0||r<=0) return;
        const v=e1RM(st.weight, st.reps);
        if(v>best.e1rm){ best.e1rm=v; best.weight=w; best.reps=r; best.date=sess.date; }
        if(w>best.wBest){ best.wBest=w; best.wReps=r; best.wDate=sess.date; }
      });
    });
  });
  return best;
}

/* ==================== Temporizador de descanso ====================
   Se calcula SIEMPRE por marca de tiempo (Date.now), nunca acumulando ticks.
   Android congela los temporizadores en segundo plano, así que un contador
   se quedaría atrasado; con marca de tiempo, al volver a la app el tiempo
   mostrado es el real transcurrido.                                        */
let restState = null;   // {endsAt, total, label, done}
let restTick = null;

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch{}
}

/* Chrome descarta la vibración si la página no está visible, que es justo lo
   que pasa al bloquear la pantalla durante el descanso. Por eso se combinan
   tres avisos:
   1. Wake Lock: mantiene la pantalla encendida mientras corre el temporizador,
      con lo que la página sigue visible y la vibración sí llega.
   2. Pitido con Web Audio, desbloqueado en la primera interacción.
   3. Notificación del sistema si aun así la app quedó en segundo plano.     */
let audioCtx=null, wakeLock=null;

function unlockAudio(){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC) audioCtx=new AC();
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }catch{}
}
document.addEventListener("pointerdown", unlockAudio, {once:false});

function beep(){
  try{
    if(!audioCtx) return;
    const now=audioCtx.currentTime;
    [0, 0.28].forEach(off=>{
      const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type="sine"; osc.frequency.value=880;
      g.gain.setValueAtTime(0.0001, now+off);
      g.gain.exponentialRampToValueAtTime(0.35, now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+off+0.22);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.24);
    });
  }catch{}
}

async function keepAwake(on){
  try{
    if(on){
      if("wakeLock" in navigator && !wakeLock){
        wakeLock=await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release",()=>{ wakeLock=null; });
      }
    }else if(wakeLock){
      await wakeLock.release(); wakeLock=null;
    }
  }catch{}
}

function notifyRestDone(label){
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission!=="granted") return;
    new Notification("Descanso terminado", {
      body: label ? `Siguiente serie · ${label}` : "Siguiente serie",
      tag: "rest", silent: false, vibrate: [320,140,320]
    });
  }catch{}
}

function askNotifications(){
  try{
    if(!("Notification" in window)){ toast("Este navegador no admite notificaciones"); return; }
    if(Notification.permission==="granted"){ toast("Las notificaciones ya están activadas"); return; }
    if(Notification.permission==="denied"){ toast("Debes permitirlas en los ajustes del navegador"); return; }
    Notification.requestPermission().then(p=>{
      toast(p==="granted" ? "Notificaciones activadas" : "Notificaciones no activadas");
      renderDataPanel();
    });
  }catch{}
}

function startRest(seconds, label){
  if(seconds<=0) return;
  restState = {endsAt: Date.now() + seconds*1000, total: seconds, label: label||"", done:false};
  if(restTick) clearInterval(restTick);
  restTick = setInterval(tickRest, 250);
  unlockAudio();
  keepAwake(true);          // pantalla encendida: así la vibración sí llega
  renderRest();
}

function stopRest(){
  restState = null;
  if(restTick){ clearInterval(restTick); restTick=null; }
  keepAwake(false);
  renderRest();
}

function restRemaining(){
  if(!restState) return 0;
  return Math.max(0, Math.round((restState.endsAt - Date.now())/1000));
}

function tickRest(){
  if(!restState) return;
  const left = restRemaining();
  if(left<=0 && !restState.done){
    restState.done = true;
    vibrate([320, 140, 320]);          // dos pulsos: se nota con el móvil en el bolsillo
    beep();
    if(document.hidden) notifyRestDone(restState.label);
    keepAwake(false);
    renderRest();
    setTimeout(()=>{ if(restState && restState.done) stopRest(); }, 12000);
    return;
  }
  renderRest();
}

function fmtClock(sec){
  const m=Math.floor(sec/60), s2=sec%60;
  return `${m}:${String(s2).padStart(2,"0")}`;
}

function renderRest(){
  const host=document.getElementById("rest-host");
  if(!host) return;
  if(!restState){ host.innerHTML=""; return; }
  const left=restRemaining();
  const pct=restState.total? (1 - left/restState.total)*100 : 100;
  if(restState.done){
    host.innerHTML=`<div class="rest done">
      <span class="rest-main">Descanso terminado</span>
      ${restState.label?`<span class="rest-lbl">${esc(restState.label)}</span>`:""}
      <button class="rest-x" id="rest-close" aria-label="Cerrar">${I.x}</button>
    </div>`;
  }else{
    host.innerHTML=`<div class="rest">
      <div class="rest-bar"><div style="width:${pct}%"></div></div>
      <div class="rest-row">
        <span class="rest-main">${fmtClock(left)}</span>
        ${restState.label?`<span class="rest-lbl">${esc(restState.label)}</span>`:""}
        <button class="rest-add" id="rest-plus">+30s</button>
        <button class="rest-x" id="rest-skip" aria-label="Saltar descanso">${I.x}</button>
      </div>
    </div>`;
  }
  const c=document.getElementById("rest-close"); if(c) c.onclick=stopRest;
  const k=document.getElementById("rest-skip"); if(k) k.onclick=stopRest;
  const pl=document.getElementById("rest-plus");
  if(pl) pl.onclick=()=>{ restState.endsAt+=30000; restState.done=false; renderRest(); };
}

// Al volver del segundo plano se recalcula de inmediato
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    renderRest();
    if(restState && !restState.done) keepAwake(true);   // el sistema lo libera al ocultarse
  }
});

  document.body.classList.toggle("light", !!t.light);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute("content", t.swatch[0]);
}

    ${S.importing?`

          ${I.alert} Restaurar SUSTITUYE todos los datos actuales de los dos perfiles.</p>
        <input type="file" id="import-file" accept="application/json,text/plain,.json,.txt"
          style="font-size:12px;color:var(--text-muted);max-width:100%">
        <button class="ghost" id="import-cancel" style="margin-top:8px">Cancelar</button>
      </div>`:""}
  </div>`;

  const $=id=>document.getElementById(id);
  if($("ask-notif")) $("ask-notif").onclick=askNotifications;
  if($("do-send")) $("do-send").onclick=sendBackup;
  if($("do-export")) $("do-export").onclick=downloadBackup;
  if($("backup-email")) $("backup-email").onchange=e=>{
    const v=e.target.value.trim();
    if(v) store.set("backupEmail", v); else store.del("backupEmail");
  };
  if($("do-import-open")) $("do-import-open").onclick=()=>{S.importing=true;renderDataPanel();};
  if($("import-cancel")) $("import-cancel").onclick=()=>{S.importing=false;renderDataPanel();};
  if($("import-file")) $("import-file").onchange=e=>{
    const file=e.target.files&&e.target.files[0];
    if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let payload=null;
      try{ payload=JSON.parse(rd.result); }
      catch{ toast("El archivo no es un JSON válido"); return; }
      const res=restoreBackup(payload);
      if(!res.ok){ toast(res.error); return; }
      S.importing=false; S.showData=false;
      init();                       // recarga todo desde el almacenamiento restaurado
      toast(`Copia restaurada (${res.count} entradas)`);
    };
    rd.onerror=()=>toast("No se pudo leer el archivo");
    rd.readAsText(file);
  };
}

function currentSession(){ return S.sessions.find(s=>s.date===S.date); }
function ensureSession(mutate){
  let cur=currentSession();
  if(!cur){ cur={id:uid(),date:S.date,day:dayName(S.date),entries:[]}; S.sessions.unshift(cur); }
  mutate(cur);
  S.sessions = S.sessions.filter(s=>s.entries.length>0 || s.id===cur.id);
  persistSessions();
}
function prevSessionFor(){
  return S.sessions.filter(s=>s.day===dayName(S.date) && s.date<S.date)
    .sort((a,b)=>a.date<b.date?1:-1)[0];
}

function copyPanel(){
  const dn=dayName(S.date);
  const cands=S.sessions.filter(x=>x.date!==S.date && x.entries.length)
    .sort((a,b)=>a.date<b.date?1:-1);
  // Primero las del mismo día de la semana: casi siempre es la que quieres repetir
  const mismos=cands.filter(x=>x.day===dn).slice(0,6);
  const otros=cands.filter(x=>x.day!==dn).slice(0,6);
  const item=x=>{
    const sets=x.entries.reduce((a,e)=>a+e.sets.length,0);
    // Grupos musculares ordenados por volumen de series: lo primero que se ve
    // es lo que más se trabajó ese día.
    const porMusculo={};
    x.entries.forEach(e=>{ porMusculo[e.muscle]=(porMusculo[e.muscle]||0)+e.sets.length; });
    const musculos=Object.entries(porMusculo).sort((a,b)=>b[1]-a[1]).map(m=>m[0]);
    const visibles=musculos.slice(0,4);
    const resto=musculos.length-visibles.length;
    return `<button class="ex-row copy-item" data-copy="${x.id}">
      <span class="copy-main">
        <span class="copy-head">
          <span class="ex-pick-name">${x.day} · ${fmtDate(x.date)}</span>
          <span class="copy-meta">${x.entries.length} ej · ${sets} series</span>
        </span>
        <span class="copy-tags">
          ${visibles.map(m=>{const c=muscleColor(m);
            return `<span class="tag" style="background:${c}${theme().tagAlpha};color:${c}">${esc(m)}</span>`;}).join("")}
          ${resto>0?`<span class="tag" style="color:var(--text-faint);background:var(--border-soft)">+${resto}</span>`:""}
        </span>
      </span>
    </button>`;
  };
  return `<div class="picker">
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 8px">
      Se copiarán los ejercicios y las series. Los pesos y reps quedarán como sugerencia, no rellenados.</p>
    <div class="picker-list">
      ${mismos.length?`<p class="card-title" style="margin:4px 0 2px">Otros ${dn.toLowerCase()}</p>${mismos.map(item).join("")}`:""}
      ${otros.length?`<p class="card-title" style="margin:10px 0 2px">Más recientes</p>${otros.map(item).join("")}`:""}
      ${!mismos.length&&!otros.length?'<p style="font-size:12px;color:var(--text-faint);padding:6px 10px">No hay sesiones anteriores.</p>':""}
    </div>
    <button class="ghost" id="copy-cancel" style="padding:4px 10px">Cancelar</button>
  </div>`;
}

/* ============================ Gráficas SVG ============================ */
let chartPoints=[];
function lineChart(points, opts){
  chartPoints=points.map(p=>({label:p.label,full:p.full,a:p.a,b:p.b,aLabel:opts.aLabel,bLabel:opts.bLabel}));
  // points: [{label, a, b}] ; a = serie principal, b = secundaria (escalas propias)
  const W=640,H=250,L=42,R=42,T=14,B=34;
  if(points.length<2) return "";
  const t=theme().chart;
  const xs=i=> L + i*(W-L-R)/(points.length-1);
  const range=(vals)=>{ const mn=Math.min(...vals),mx=Math.max(...vals); const p=(mx-mn)*0.15||Math.abs(mx*0.1)||1; return [mn-p,mx+p]; };
  const [aMin,aMax]=range(points.map(p=>p.a));
  const [bMin,bMax]=range(points.map(p=>p.b));
  const ya=v=> H-B-((v-aMin)/(aMax-aMin||1))*(H-T-B);
  const yb=v=> H-B-((v-bMin)/(bMax-bMin||1))*(H-T-B);
  const path=(f,key)=>points.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${f(p[key]).toFixed(1)}`).join("");
  const ticks=4;
  const grid=Array.from({length:ticks+1},(_,i)=>{
    const y=T+i*(H-T-B)/ticks;
    const va=aMax-(i*(aMax-aMin)/ticks);
    const vb=bMax-(i*(bMax-bMin)/ticks);
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${t.grid}" stroke-dasharray="2 4"/>
      <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${t.axis}">${Math.round(va)}</text>
      <text x="${W-R+6}" y="${y+4}" font-size="10" fill="${t.axis}">${Math.round(vb)}</text>`;
  }).join("");
  const step=Math.max(1,Math.ceil(points.length/5));
  const xlabels=points.map((p,i)=> i%step===0||i===points.length-1
    ? `<text x="${xs(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="${t.axis}">${esc(p.label)}</text>`:"").join("");
  return `<div class="chartbox" style="position:relative"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}${xlabels}
    <path d="${path(yb,"b")}" fill="none" stroke="${t.secondary}" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="${path(ya,"a")}" fill="none" stroke="${t.primary}" stroke-width="2.5"/>
    ${points.map((p,i)=>`<circle cx="${xs(i)}" cy="${yb(p.b)}" r="2.5" fill="${t.secondary}"/>`).join("")}
    ${points.map((p,i)=>`<circle cx="${xs(i)}" cy="${ya(p.a)}" r="3" fill="${t.primary}"/>`).join("")}
    ${points.map((p,i)=>`<line x1="${xs(i)}" y1="${T}" x2="${xs(i)}" y2="${H-B}" stroke="transparent" stroke-width="${Math.max(14,(W-L-R)/points.length)}"
      style="cursor:pointer" data-pt="${i}"/>`).join("")}
  </svg>
  <div class="chart-tip hide"></div></div>
  <div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text-muted);flex-wrap:wrap">
    <span><span style="display:inline-block;width:14px;height:2px;background:${t.primary};vertical-align:middle;margin-right:5px"></span>${esc(opts.aLabel)}</span>
    <span><span style="display:inline-block;width:14px;height:2px;background:${t.secondary};vertical-align:middle;margin-right:5px"></span>${esc(opts.bLabel)}</span>
  </div>`;
}

let chartRows=[],chartKeys=[];
function stackedBars(rows, keys){
  chartRows=rows; chartKeys=keys;
  const W=640,H=290,L=32,R=8,T=12,B=34;
  if(rows.length===0) return "";
  const t=theme().chart;
  const totals=rows.map(r=>keys.reduce((a,k)=>a+(r[k]||0),0));
  const max=Math.max(...totals,1);
  const bw=Math.min(38,(W-L-R)/rows.length*0.7);
  const gap=(W-L-R)/rows.length;
  const ticks=4;
  const grid=Array.from({length:ticks+1},(_,i)=>{
    const y=T+i*(H-T-B)/ticks, v=Math.round(max-(i*max/ticks));
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${t.grid}" stroke-dasharray="2 4"/>
      <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${t.axis}">${v}</text>`;
  }).join("");
  const step=Math.max(1,Math.ceil(rows.length/6));
  const bars=rows.map((r,i)=>{
    const x=L+i*gap+(gap-bw)/2;
    let acc=0;
    const segs=keys.map(k=>{
      const v=r[k]||0; if(v===0) return "";
      const h=(v/max)*(H-T-B);
      const y=H-B-acc-h; acc+=h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${muscleColor(k)}"/>`;
    }).join("");
    const lbl=i%step===0||i===rows.length-1
      ? `<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="${t.axis}">${esc(r.week)}</text>`:"";
    const hit=`<rect x="${L+i*gap}" y="${T}" width="${gap}" height="${H-T-B}" fill="transparent" style="cursor:pointer" data-bar="${i}"/>`;
    return segs+lbl+hit;
  }).join("");
  return `<div class="chartbox" style="position:relative"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${bars}</svg><div class="chart-tip hide"></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text-muted)">
    ${keys.map(k=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${muscleColor(k)};vertical-align:-1px;margin-right:5px"></span>${esc(k)}</span>`).join("")}
  </div>`;
}

/* Agrupa una serie diaria según el periodo: día suelto en 1 mes, media diaria
   por semana en 6 meses y por mes en 1 año. Usar siempre "media diaria" hace
   que las barras sean comparables entre periodos y que la línea de objetivo
   siga teniendo sentido. */
function bucketDaily(rangeId, valueOf){
  const cfg={ "1m":{days:30,by:"day"}, "6m":{days:182,by:"week"}, "1y":{days:365,by:"month"} }[rangeId] || {days:30,by:"day"};
  const buckets=new Map();
  for(let i=cfg.days-1;i>=0;i--){
    const iso=daysAgo(i);
    let key,label,full;
    if(cfg.by==="day"){ key=iso; label=parseISO(iso).toLocaleDateString("es-ES",{day:"numeric",month:"short"}); full=fmtDate(iso); }
    else if(cfg.by==="week"){ key=weekKey(iso); label=parseISO(key).toLocaleDateString("es-ES",{day:"numeric",month:"short"}); full="Semana del "+fmtDate(key); }
    else { key=iso.slice(0,7); const d=parseISO(key+"-01");
           label=d.toLocaleDateString("es-ES",{month:"short"}); full=MONTHS[d.getMonth()]+" "+d.getFullYear(); }
    if(!buckets.has(key)) buckets.set(key,{label,full,sum:0,days:0,logged:0});
    const b=buckets.get(key);
    const v=valueOf(iso);
    b.sum+=v; b.days++; if(v>0) b.logged++;
  }
  return [...buckets.values()].map(b=>({label:b.label,full:b.full,
    value:Math.round(b.sum/Math.max(1,b.days)), total:Math.round(b.sum), logged:b.logged, days:b.days,
    single:cfg.by==="day"}));
}

// Cada gráfico guarda sus propios datos: antes había una sola variable global y
// el segundo gráfico de la vista pisaba los datos del primero.
let barCharts={}, barChartSeq=0;
function simpleBars(rows, opts){
  const cid = "bc"+(++barChartSeq);
  barCharts[cid] = {rows, unit:opts.unit||""};
  const W=640,H=250,L=42,R=8,T=14,B=34;
  if(rows.length===0) return "";
  const t=theme().chart;
  const goal=opts.goal||0;
  const max=Math.max(...rows.map(r=>r.value), goal, 1)*1.08;
  const gap=(W-L-R)/rows.length;
  const bw=Math.max(2,Math.min(30,gap*0.72));
  const ticks=4;
  const grid=Array.from({length:ticks+1},(_,i)=>{
    const y=T+i*(H-T-B)/ticks, v=Math.round(max-(i*max/ticks));
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${t.grid}" stroke-dasharray="2 4"/>
      <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${t.axis}">${v>=1000?(v/1000).toFixed(v>=10000?0:1)+"k":v}</text>`;
  }).join("");
  const goalLine = goal>0 ? `<line x1="${L}" y1="${H-B-(goal/max)*(H-T-B)}" x2="${W-R}" y2="${H-B-(goal/max)*(H-T-B)}"
      stroke="${t.primary}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>` : "";
  const step=Math.max(1,Math.ceil(rows.length/6));
  const bars=rows.map((r,i)=>{
    const x=L+i*gap+(gap-bw)/2;
    const h=(r.value/max)*(H-T-B);
    const y=H-B-h;
    const col=opts.color||t.primary;
    const dim=goal>0 && r.value<goal;
    const rect=r.value>0
      ? `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="1.5" fill="${col}" opacity="${dim?0.45:1}"/>`
      : "";
    const lbl=i%step===0||i===rows.length-1
      ? `<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="${t.axis}">${esc(r.label)}</text>`:"";
    const hit=`<rect x="${L+i*gap}" y="${T}" width="${gap}" height="${H-T-B}" fill="transparent" style="cursor:pointer" data-sbar="${cid}:${i}"/>`;
    return rect+lbl+hit;
  }).join("");
  return `<div class="chartbox" style="position:relative">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${goalLine}${bars}</svg>
    <div class="chart-tip hide"></div></div>`;
}

function rangeSelector(id,current,only){

/* ============================ Vista: Volumen ============================ */
function viewVolume(){
  const raw=cutoffFor(RANGES.find(r=>r.id===S.volRange).m);
  const cut=raw?weekKey(raw):null; // semanas completas
  const inRange=cut? S.sessions.filter(s=>s.date>=cut):S.sessions;
  const byWeek={};
  inRange.forEach(s=>{
    const wk=weekKey(s.date);
    byWeek[wk]=byWeek[wk]||{};
    s.entries.forEach(e=>{
      const done=e.sets.filter(x=>x.weight!==""&&x.reps!=="").length;
      byWeek[wk][e.muscle]=(byWeek[wk][e.muscle]||0)+done;
    });
  });
  const weeks=Object.keys(byWeek).sort();
  const rows=weeks.map(w=>{
    const r={week:parseISO(w).toLocaleDateString("es-ES",{day:"numeric",month:"short"}), full:fmtDate(w)};
    MUSCLE_GROUPS.forEach(m=>r[m]=byWeek[w][m]||0);
    return r;
  });
  const active=MUSCLE_GROUPS.filter(m=>weeks.some(w=>byWeek[w][m]>0));

  return `<div class="col g4">
    ${rangeSelector("vol",S.volRange)}
    ${rows.length===0
      ? `<div class="empty">${I.bars}<h3>Aún no hay series registradas</h3><p>Registra sesiones con peso y reps en este periodo.</p></div>`

         ${landmarksCard(byWeek,weeks)}`}

}

function viewSteps(){
  const b=bodyOf(S.activeId);
  const goal=S.goal>0?S.goal:DEFAULT_GOAL;
  const t=todayISO();
  const today=S.steps[t]||0;
  const pct=Math.min(100,Math.round(today/goal*100));

  // Racha
  let streak=0;
  const start=(S.steps[t]||0)>=goal?0:1;
  for(let i=start;i<400;i++){ if((S.steps[daysAgo(i)]||0)>=goal) streak++; else break; }

  // Media 7 días
  const last7=[]; for(let i=0;i<7;i++){ const v=S.steps[daysAgo(i)]; if(v>0) last7.push(v); }
  const avg7=last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length):null;

  // Entreno vs descanso (90 días)
  const sessDates=new Set(S.sessions.map(s=>s.date));
  const cut=daysAgo(90); const train=[],rest=[];
  Object.entries(S.steps).forEach(([d,v])=>{ if(d<cut||!v)return; (sessDates.has(d)?train:rest).push(v); });
  const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const tAvg=mean(train),rAvg=mean(rest);
  const diff=(tAvg!==null&&rAvg)?Math.round((tAvg-rAvg)/rAvg*100):null;

  const sel=S.stepDate;

  return `<div class="col g4">
    <div class="card" style="padding:16px 16px 0;overflow:hidden">

/* ============================ Datos de prueba ============================ */
const DEMO={
  Domingo:[["def-01",4,70,8],["def-02",3,120,10],["def-23",3,45,12],["def-03",3,35,12],["def-04",4,60,15]],
  Lunes:[["def-07",4,50,8],["def-09",3,40,10],["def-05",3,30,12],["def-06",3,30,10],["def-08",3,25,12],["def-13",3,12,12]],
  Martes:[["def-16",4,55,10],["def-17",3,45,10],["def-25",3,30,10],["def-19",3,18,15],["def-21",3,25,10],["def-27",3,12,12]],
  Miércoles:[["def-06",4,32,10],["def-12",4,10,15],["def-10",3,20,15],["def-26",3,30,10],["def-28",3,10,12],["def-14",3,40,15],["def-15",3,0,15]]
};
function buildDemo(weeks){
  const byId=Object.fromEntries(S.exercises.map(e=>[e.id,e]));
  const out=[]; const anchor=new Date(); anchor.setDate(anchor.getDate()-anchor.getDay());
  const now=new Date();
  for(let w=weeks-1;w>=0;w--){
    DAYS.forEach((dn,off)=>{
      const d=new Date(anchor); d.setDate(anchor.getDate()-w*7+off);
      if(d>now) return;
      const elapsed=weeks-1-w;
      const entries=(DEMO[dn]||[]).map(([id,n,base,reps])=>{
        const ex=byId[id]; if(!ex) return null;
        const kg=base>0?Math.max(0,Math.round(base*(1+elapsed*0.012)*(1+(Math.random()-0.5)*0.04)/2.5)*2.5):0;
        return {id:uid(),exerciseId:ex.id,name:ex.name,muscle:ex.muscle,
          sets:Array.from({length:n},(_,i)=>({id:uid(),weight:String(kg),reps:String(Math.max(4,reps-(i>=2?Math.round(Math.random()*2):0)))}))};
      }).filter(Boolean);
      if(entries.length) out.push({id:uid(),date:toISO(d),day:dn,entries});
    });
  }
  return out.sort((a,b)=>a.date<b.date?1:-1);
}

/* ============================ Eventos ============================ */
function wire(){
  const $=s=>document.getElementById(s);
  const all=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);

  // --- Registrar ---
  if($("log-date")) $("log-date").onchange=e=>{S.date=e.target.value;S.saveState="idle";S.showPicker=false;renderMain();};
  if($("add-ex")) $("add-ex").onclick=()=>{S.showPicker=true;pickerQuery="";pickerCreating=false;renderMain();};

  // --- Copiar una sesión anterior ---
  if($("copy-open")) $("copy-open").onclick=()=>{S.copying=true;S.showPicker=false;renderMain();};
  if($("copy-cancel")) $("copy-cancel").onclick=()=>{S.copying=false;renderMain();};
  all("[data-copy]",b=>b.onclick=()=>{
    const src=S.sessions.find(x=>x.id===b.dataset.copy); if(!src) return;
    // Los pesos y reps NO se copian como valores: pasan a ser sugerencia (gw/gr),
    // así ves lo que hiciste pero el registro empieza vacío.
    ensureSession(c=>{
      c.entries = src.entries.map(e=>({
        id:uid(), exerciseId:e.exerciseId, name:e.name, muscle:e.muscle,
        sets: e.sets.map(st=>({id:uid(), weight:"", reps:"",
          gw: st.weight!==""?st.weight:undefined,
          gr: st.reps!==""?st.reps:undefined}))
      }));
      c.copiedFrom = src.date;
    });
    S.copying=false;
    toast(`Copiada del ${fmtDate(src.date)}`);
    renderMain();
  });

  all("[data-toggle-ex]",b=>b.onclick=()=>{const id=b.dataset.toggleEx;S.openEx[id]=S.openEx[id]===false;renderMain();});
  all("[data-del-ex]",b=>b.onclick=()=>{const id=b.dataset.delEx;ensureSession(c=>{c.entries=c.entries.filter(e=>e.id!==id);});renderMain();});
  all("[data-add-set]",b=>b.onclick=()=>{const id=b.dataset.addSet;
    ensureSession(c=>{const e=c.entries.find(x=>x.id===id); if(e) e.sets.push({id:uid(),weight:"",reps:""});});renderMain();});
  all("[data-del-set]",b=>b.onclick=()=>{const [ex,st]=b.dataset.delSet.split(":");
    ensureSession(c=>{const e=c.entries.find(x=>x.id===ex); if(e) e.sets=e.sets.filter(s=>s.id!==st);});renderMain();});

  // Inputs de series: actualizan sin re-render para no perder el foco al escribir
  all("[data-set]",inp=>{
    inp.oninput=()=>{
      const [exId,setId,field]=inp.dataset.set.split(":");
      const cur=currentSession(); if(!cur) return;
      const e=cur.entries.find(x=>x.id===exId); if(!e) return;
      const s=e.sets.find(x=>x.id===setId); if(!s) return;
      const eraCompleta = s.weight!=="" && s.reps!=="";
      s[field]=inp.value;
      const esCompleta = s.weight!=="" && s.reps!=="";
      S.saveState="saving";
      persistSessions();                    // escritura síncrona inmediata

      // Al cerrar una serie: arranca el descanso y comprueba si es récord
      if(!eraCompleta && esCompleta){
        const b=bodyOf(S.activeId);
        const segs=Math.round((b.restMin??DEFAULT_BODY.restMin)*60);
        startRest(segs, e.name);
        const prev=bestFor(e.exerciseId, S.date);
        const v=e1RM(s.weight, s.reps);
        if(prev.e1rm>0 && v>prev.e1rm*1.001){
          vibrate([60,50,60]);
          toast(`Récord en ${e.name}`);
        }
      }

      const row=document.querySelector(`[data-setrow="${exId}:${setId}"]`);
      if(row){
        const done=s.weight!==""&&s.reps!=="";
        row.classList.toggle("done",done);
        const idx=row.querySelector(".set-idx");
        const pos=e.sets.findIndex(x=>x.id===setId);
        if(idx) idx.innerHTML=done?I.check:String(pos+1);
      }
      updateSummary();
    };
  });

  // --- Selector de ejercicios ---
  if($("picker-q")){
    const q=$("picker-q");
    q.oninput=()=>{pickerQuery=q.value;const pos=q.selectionStart;renderMain();
      const nq=document.getElementById("picker-q"); if(nq){nq.focus();nq.setSelectionRange(pos,pos);} };
  }
  all("[data-pick]",b=>b.onclick=()=>{
    const ex=S.exercises.find(e=>e.id===b.dataset.pick); if(!ex)return;
    ensureSession(c=>c.entries.push({id:uid(),exerciseId:ex.id,name:ex.name,muscle:ex.muscle,sets:[{id:uid(),weight:"",reps:""}]}));
    S.showPicker=false;pickerQuery="";renderMain();
  });
  if($("new-ex")) $("new-ex").onclick=()=>{pickerCreating=true;renderMain();};
  if($("new-cancel")) $("new-cancel").onclick=()=>{pickerCreating=false;renderMain();};
  if($("new-save")) $("new-save").onclick=()=>{
    const name=$("new-name").value.trim(); if(!name)return;
    const ex={id:uid(),name,muscle:$("new-muscle").value};
    S.exercises.push(ex); store.set("exercises",S.exercises);
    ensureSession(c=>c.entries.push({id:uid(),exerciseId:ex.id,name:ex.name,muscle:ex.muscle,sets:[{id:uid(),weight:"",reps:""}]}));
    pickerCreating=false;S.showPicker=false;pickerQuery="";renderMain();
  };
  all("[data-edit-ex]",b=>b.onclick=()=>{editingEx=b.dataset.editEx;confirmingEx=null;renderMain();});
  if($("edit-cancel")) $("edit-cancel").onclick=()=>{editingEx=null;renderMain();};
  if($("edit-save")) $("edit-save").onclick=()=>{
    const ex=S.exercises.find(e=>e.id===editingEx); if(!ex)return;
    const n=$("edit-name").value.trim(); if(!n)return;
    ex.name=n; ex.muscle=$("edit-muscle").value;
    store.set("exercises",S.exercises); editingEx=null; toast("Ejercicio actualizado"); renderMain();
  };
  all("[data-ask-del]",b=>b.onclick=()=>{confirmingEx=b.dataset.askDel;editingEx=null;renderMain();});
  if($("cancel-del")) $("cancel-del").onclick=()=>{confirmingEx=null;renderMain();};
  all("[data-confirm-del]",b=>b.onclick=()=>{
    S.exercises=S.exercises.filter(e=>e.id!==b.dataset.confirmDel);
    store.set("exercises",S.exercises); confirmingEx=null; toast("Ejercicio eliminado"); renderMain();
  });

  // --- Tooltips de las gráficas ---
  window.__showTip = showTip;
  function showTip(html, evt, svg){
    const box=svg.closest(".chartbox"); if(!box) return;
    const tip=box.querySelector(".chart-tip"); if(!tip) return;
    tip.innerHTML=html; tip.classList.remove("hide");
    const br=box.getBoundingClientRect(), tr=tip.getBoundingClientRect();
    let x=evt.clientX-br.left+12, y=evt.clientY-br.top-tr.height-10;
    if(x+tr.width>br.width) x=evt.clientX-br.left-tr.width-12;
    if(x<0) x=4;
    if(y<0) y=evt.clientY-br.top+16;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  }
  window.__hideTips = hideTips;
  function hideTips(){ document.querySelectorAll(".chart-tip").forEach(t=>t.classList.add("hide")); }

  all("[data-pt]",el=>el.onclick=e=>{
    const p=chartPoints[+el.dataset.pt]; if(!p) return;
    showTip(`<div class="tip-date">${esc(p.full||p.label)}</div>
      <div class="tip-row"><span>${esc(p.aLabel)}</span><span class="tip-val">${nf(p.a)}</span></div>
      <div class="tip-row"><span>${esc(p.bLabel)}</span><span class="tip-val">${nf(p.b)}</span></div>`, e, el.ownerSVGElement);
  });
  all("[data-bar]",el=>el.onclick=e=>{
    const r=chartRows[+el.dataset.bar]; if(!r) return;
    const items=chartKeys.filter(k=>r[k]>0).sort((a,b)=>r[b]-r[a]);
    const total=items.reduce((a,k)=>a+r[k],0);
    showTip(`<div class="tip-date">Semana del ${esc(r.full||r.week)}</div>
      ${items.map(k=>`<div class="tip-row"><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${muscleColor(k)};margin-right:5px"></span>${esc(k)}</span><span class="tip-val">${r[k]}</span></div>`).join("")}
      <div class="tip-row" style="border-top:1px solid var(--border);margin-top:5px;padding-top:5px">
        <span>Total</span><span class="tip-val">${total} series</span></div>`, e, el.ownerSVGElement);
  });
  // Cierra el tooltip al tocar fuera. Se registra en el siguiente ciclo para no
  // capturar el mismo clic que acaba de abrirlo.
  if(!window.__tipCloser){
    window.__tipCloser=true;
    document.addEventListener("click",e=>{
      if(!e.target.closest("[data-pt],[data-bar],[data-sbar],.chart-tip")) window.__hideTips && window.__hideTips();
    });
  }

  // --- Rangos y progresión ---
  all("[data-range]",b=>b.onclick=()=>{
    const [which,val]=b.dataset.range.split(":");
    if(which==="prog") S.progRange=val;
    else if(which==="vol") S.volRange=val;
    else if(which==="steps") S.stepsRange=val;
    else if(which==="cal") S.calRange=val;
    renderMain();
  });
  all("[data-sbar]",el=>el.onclick=e=>{
    const [cid,idx]=el.dataset.sbar.split(":");
    const chart=barCharts[cid]; if(!chart) return;
    const r=chart.rows[+idx]; if(!r) return;
    const detalle = r.single
      ? `<div class="tip-row"><span>${esc(chart.unit)}</span><span class="tip-val">${nf(r.value)}</span></div>`
      : `<div class="tip-row"><span>Media diaria</span><span class="tip-val">${nf(r.value)}</span></div>
         <div class="tip-row"><span>Total</span><span class="tip-val">${nf(r.total)}</span></div>
         <div class="tip-row"><span>Días con datos</span><span class="tip-val">${r.logged}/${r.days}</span></div>`;
    showTip(`<div class="tip-date">${esc(r.full)}</div>${detalle}`, e, el.ownerSVGElement);
  });
  if($("prog-select")) $("prog-select").onchange=e=>{S.progEx=e.target.value;renderMain();};

  // --- Historial ---
  all("[data-year]",b=>b.onclick=()=>{const y=b.dataset.year;S.openYears[y]=!S.openYears[y];renderMain();});
  all("[data-month]",b=>b.onclick=()=>{const m=b.dataset.month;S.openMonths[m]=!S.openMonths[m];renderMain();});
  all("[data-sess]",b=>b.onclick=e=>{
    if(e.target.closest("[data-del-sess]")) return;
    const id=b.dataset.sess; S.openSession=S.openSession===id?null:id; renderMain();
  });
  all("[data-del-sess]",b=>b.onclick=e=>{
    e.stopPropagation();

    const s=S.sessions.find(x=>x.id===id); if(!s)return;

    saveSessionMonth(S.activeId,monthOf(s.date),S.sessions);

  if($("ask-reset")) $("ask-reset").onclick=()=>{confirmReset=true;renderMain();};
  if($("cancel-reset")) $("cancel-reset").onclick=()=>{confirmReset=false;renderMain();};
  if($("do-reset")) $("do-reset").onclick=()=>{

  if($("load-demo")) $("load-demo").onclick=()=>{
    const demo=buildDemo(10);

  // --- Pasos ---
  if($("step-date")) $("step-date").onchange=e=>{S.stepDate=e.target.value;S.saveState="idle";renderMain();};
  if($("step-val")) $("step-val").oninput=e=>{

    S.saveState="saving"; persistSteps(monthOf(S.stepDate));

  };
  if($("goal-edit")) $("goal-edit").onclick=()=>{S.editingGoal=true;renderMain();};
  if($("goal-save")) $("goal-save").onclick=()=>{
    const n=parseInt($("goal-inp").value,10);

  if($("goal-inp")) $("goal-inp").onkeydown=e=>{ if(e.key==="Enter") $("goal-save").click(); };

  // --- Datos corporales ---

    S.editingBody=false; toast("Datos guardados"); renderMain();

// Actualiza el resumen sin re-renderizar (evita perder el foco al escribir)
function updateSummary(){
  const cur=currentSession(); if(!cur) return;
  const entries=cur.entries;
  const total=entries.reduce((a,e)=>a+e.sets.length,0);
  const done=entries.reduce((a,e)=>a+e.sets.filter(s=>s.weight!==""&&s.reps!=="").length,0);
  const vol=entries.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0),0),0);
  const nums=document.querySelectorAll(".summary .stat-num");
  if(nums.length>=3){
    nums[0].innerHTML=`${done}<span style="color:var(--text-ghost);font-size:15px;font-weight:400">/${total}</span>`;
    nums[1].textContent=nf(Math.round(vol));
    nums[2].textContent=entries.length;
  }
  // progreso por ejercicio
  entries.forEach(e=>{
    const d=e.sets.filter(s=>s.weight!==""&&s.reps!=="").length;
    const allDone=e.sets.length>0&&d===e.sets.length;
    const block=document.querySelector(`[data-toggle-ex="${e.id}"]`)?.closest(".exercise");
    if(!block) return;
    const bar=block.querySelector(".progress > div");
    if(bar){ bar.style.width=(e.sets.length?d/e.sets.length*100:0)+"%";
      bar.style.background=allDone?"var(--accent)":muscleColor(e.muscle); }
    const c=block.querySelector(".count");
    if(c) c.innerHTML=`<span style="color:${allDone?"var(--accent)":"var(--text-dim)"}">${d}</span><span style="color:var(--text-ghost)">/${e.sets.length}</span>`;
  });
}
function updateStepsHeader(){
  const goal=S.goal>0?S.goal:DEFAULT_GOAL;
  const v=S.steps[todayISO()]||0;
  const big=document.querySelector(".steps-big");
  if(big) big.innerHTML=`${nf(v)}<span class="steps-goal">/ ${nf(goal)}</span>`;
  const bar=document.querySelector(".card .progress > div");
  if(bar) bar.style.width=Math.min(100,Math.round(v/goal*100))+"%";
}

  S.exercises=store.get("exercises",null);
  if(!Array.isArray(S.exercises)||S.exercises.length===0){
    S.exercises=DEFAULT_EXERCISES.map(e=>({...e}));
    store.set("exercises",S.exercises);
  }
  S.sessions=loadSessions(S.activeId);
  S.steps=loadSteps(S.activeId);
  S.goal=store.get(`stepsGoal:${S.activeId}`,DEFAULT_GOAL);
  const now=new Date();
  S.openYears[String(now.getFullYear())]=true;
  S.openMonths[`${now.getFullYear()}-${pad(now.getMonth()+1)}`]=true;
  renderAll();
  wireVersionButton();
}

// Service worker: solo funciona servido por http(s), no con file://.
// Si falla no pasa nada, la app sigue funcionando igual.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

// Comprobación de almacenamiento: si el navegador lo bloquea, avisar en vez de
// fallar en silencio (pasa en modo incógnito de algunos navegadores móviles).
try{
  localStorage.setItem(K+"__test","1"); localStorage.removeItem(K+"__test");
  init();
}catch(e){
  document.getElementById("main").innerHTML=
    `<div class="empty">${I.alert}<h3>El navegador bloquea el almacenamiento</h3>
     <p>Sal del modo incógnito o permite los datos de sitio para que la app pueda guardar tus entrenamientos.</p></div>`;
}
</script>
</body>
</html>
